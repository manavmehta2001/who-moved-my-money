<text x="973.8333333333333" y="575" text-anchor="middle" font-size="18" fill="#1f2a44">+ 12 weekly snapshots</text>
<rect x="1138.1666666666667" y="488" width="244" height="112" rx="12" fill="#fef0c2" stroke="#e0b21a" stroke-width="2.4"/>
