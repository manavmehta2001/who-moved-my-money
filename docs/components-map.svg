<text x="687.4999999999999" y="575" text-anchor="middle" font-size="18" fill="#1f2a44">12 weeks of history</text>
<rect x="851.8333333333333" y="488" width="244" height="112" rx="12" fill="#fef0c2" stroke="#e0b21a" stroke-width="2.4"/>
